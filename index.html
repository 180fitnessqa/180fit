<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>180 Fitness · Class Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{color-scheme:dark;--bg:#050505;--card:#121212;--line:#2b2b2b;--tx:#f5f5f5;--mut:#8d8d8d;--work:#e15f00;--rest:#d9d9d9;--hf:'Barlow Condensed','Tajawal','Arial Narrow',sans-serif;--grain:none;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) var(--grain);color:var(--tx);font-family:'Tajawal',system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding:18px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:5px}
input,select{width:100%;font-family:inherit;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px 10px;font-size:16px}
input:focus,select:focus{outline:none;border-color:var(--work);box-shadow:0 0 0 2px rgba(230,95,0,.35)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
button{font-family:inherit;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;background:var(--card);color:var(--tx)}
button.p{background:var(--work);border-color:var(--work)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}
.saved{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.saved span{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:14px;cursor:pointer}
#items{counter-reset:i;display:grid;gap:8px;margin:6px 0 16px}
.row3{display:grid;grid-template-columns:26px 1fr 84px 74px;gap:8px;align-items:center}
.no::before{counter-increment:i;content:counter(i);color:var(--work);font-weight:800}
.names{display:grid;gap:8px;margin:8px 0 16px}
.st{display:flex;gap:8px;align-items:center}.st>input{flex:1;min-width:0}
.pv{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px}
.pv svg{width:100%;height:100%}
.up{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;white-space:nowrap;cursor:pointer;margin:0;color:var(--tx);display:inline-block;text-align:center}
.x{padding:9px 12px;border-radius:10px}
.logo{direction:ltr;display:flex;flex-direction:column;align-items:center;color:var(--work);line-height:1;margin:2px auto 12px}
.logo b{font-size:48px;font-weight:400;letter-spacing:-1px;font-family:'Anton',Impact,'Arial Black',sans-serif;position:relative;padding-right:15px}
.logo i{position:absolute;top:2px;right:0;width:12px;height:12px;border:3px solid var(--work);border-radius:50%}
.logo span{font:600 17px/1 var(--hf);letter-spacing:10px;margin-top:3px;padding-left:10px}
#show{display:none;position:fixed;inset:0;background:var(--bg) var(--grain);padding:max(14px,env(safe-area-inset-top,0px)) 16px max(14px,env(safe-area-inset-bottom,0px));flex-direction:column;text-align:center}
#show.on{display:flex}
#show .logo{margin:0 auto}#show .logo b{font-size:30px}
#top{display:flex;justify-content:space-between;color:var(--mut);font:600 clamp(16px,2.4vh,26px)/1.2 var(--hf);letter-spacing:2px;text-transform:uppercase;direction:ltr}
#state{display:inline-block;align-self:center;justify-self:center;max-width:100%;margin:8px auto 4px;padding:4px 22px;border:2px solid var(--c,var(--tx));border-radius:999px;font:800 clamp(18px,3.6vw,42px)/1.25 var(--hf);letter-spacing:2px;text-transform:uppercase;direction:ltr}
#time{font-family:var(--hf);font-size:clamp(80px,17vw,180px);font-weight:700;line-height:.95;letter-spacing:2px;font-variant-numeric:tabular-nums}
#state,#time{color:var(--c,var(--tx))}
.work{--c:var(--work)}.rest{--c:var(--rest)}.ready{--c:#fff}
#bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:10px 0}
#fill{height:100%;width:0;background:var(--c,var(--work))}
#cards{flex:1;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));grid-auto-rows:minmax(0,1fr);min-height:0;margin:6px 0 10px}
#big{flex:1;min-height:0;display:none;margin:6px 0 10px}
.c{background:linear-gradient(160deg,#1b1b1b,#0d0d0d);border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow:hidden;direction:ltr}
.big{width:100%}
.c video,.c img,.c .art{width:100%;flex:1;min-height:0;object-fit:cover;border-radius:14px;margin-bottom:10px;background:#000}
.art{display:flex;background:transparent!important}.art svg{width:100%;height:100%}
.pv .art{width:100%;height:100%}
.c .art{background:radial-gradient(ellipse at 50% 80%,#2b1a0f,#0d0d0d 72%)!important}
.c small{order:-1;align-self:flex-start;color:#000;background:var(--work);border-radius:8px;padding:1px 10px;margin-bottom:8px;font:700 clamp(13px,1.8vh,20px)/1.45 var(--hf);letter-spacing:1px;text-transform:uppercase}
.c b{font-family:var(--hf);font-weight:700;text-transform:uppercase;letter-spacing:.5px;line-height:1.05;font-size:clamp(18px,min(3.4vh,3.2vw),44px)}
.tg{color:var(--work);font-family:var(--hf);font-size:clamp(20px,min(3.8vh,3.6vw),50px);font-weight:700;letter-spacing:1px;line-height:1.1;min-height:1em;margin-top:2px}
.big b{font-size:clamp(34px,min(7vh,8vw),92px)}.big .tg{font-size:clamp(28px,min(6vh,7vw),76px)}
.c{position:relative}
.num{position:absolute;top:10px;left:10px;z-index:2;width:clamp(40px,7.5vh,88px);height:clamp(40px,7.5vh,88px);border-radius:50%;background:var(--work);color:#000;display:flex;align-items:center;justify-content:center;font:800 clamp(26px,5vh,60px)/1 var(--hf);box-shadow:0 0 0 4px #0d0d0d}
.big .num{width:clamp(56px,11vh,130px);height:clamp(56px,11vh,130px);font-size:clamp(40px,8vh,96px);top:16px;left:16px}
@keyframes bob{50%{transform:scaleY(.78)}}@keyframes jmp{50%{transform:translateY(-20px)}}@keyframes dn{50%{transform:translateY(10px)}}
@keyframes sw{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}@keyframes kick{50%{transform:rotate(-80deg)}}@keyframes up{50%{transform:translateY(-14px)}}
#tot{height:16px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:6px;direction:ltr}
#totf{height:100%;width:100%;background:linear-gradient(90deg,#ff8a2a,var(--work));border-radius:8px;transition:width 1s linear}
#ctl{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);width:min(420px,90vw);z-index:5;opacity:0;pointer-events:none;transition:opacity .25s}
#ctl.v{opacity:1;pointer-events:auto}#ctl button{background:rgba(18,18,18,.95)}
@media (orientation:landscape) and (min-width:700px){
#show.on{display:grid;grid-template-columns:30% 1fr;grid-template-rows:auto auto auto auto auto 1fr auto auto;column-gap:18px}
#show>#top{grid-area:1/1;flex-direction:column;align-items:center;gap:4px}
#show>.logo{grid-area:2/1;margin:10px auto}
#state{grid-area:3/1;font-size:clamp(20px,4.2vh,46px)}
#time{grid-area:4/1;font-size:min(13vw,30vh)}
#bar{grid-area:5/1}
#tot{grid-column:1/3;grid-row:8;margin-top:12px}
#cards,#big{grid-column:2;grid-row:1/8;margin:0}
#cards{grid-template-columns:repeat(var(--cols,4),1fr);grid-auto-rows:minmax(0,1fr);gap:14px}
.c{padding:14px}
}

img.logo{display:block;height:clamp(58px,10vh,100px);width:auto;max-width:80%;margin:2px auto 12px}
#show img.logo{height:clamp(40px,7vh,74px);margin:4px auto}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:20px 10px 14px;margin-bottom:14px;border:1px solid var(--line);background:var(--card)}
.hero img.logo{margin:0 auto 6px}
.hero::after{content:"";position:absolute;left:14%;right:14%;bottom:0;height:3px;border-radius:3px;background:var(--work);box-shadow:0 0 18px 4px rgba(225,95,0,.7)}
#show.ready,#show.done{background:var(--bg)}
#show.done{--c:var(--work)}
#tot{overflow:visible}#totf{box-shadow:0 0 14px rgba(225,95,0,.65)}
.tabs button{padding:12px 4px;font-size:14px}
.chk{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px}.chk input{width:22px;height:22px;padding:0}
.part{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;background:var(--card)}
.ph{display:grid;grid-template-columns:1fr 1fr 42px;gap:6px;margin-bottom:8px}
.lv h4{margin:8px 0 6px;font-size:12px;letter-spacing:1px;color:var(--work)}
.ln{display:grid;grid-template-columns:52px 1fr 130px 40px;gap:6px;margin-bottom:6px}
.lh{display:grid;grid-template-columns:52px 1fr 130px 40px;gap:6px;font-size:11px;color:var(--mut);margin-bottom:4px}
.ln .x,.ph .x{padding:0}.add{width:100%;padding:8px;font-size:13px;margin-bottom:4px}
#cal{display:none;position:fixed;inset:0;z-index:3;background:var(--bg) var(--grain);padding:max(14px,env(safe-area-inset-top,0px)) 24px max(14px,env(safe-area-inset-bottom,0px));flex-direction:column}
#cal.on{display:flex}
#ch{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;direction:ltr}
#cal img.logo{height:clamp(34px,6.5vh,64px);margin:0;justify-self:start;max-width:none}
#ct{font:700 clamp(30px,6vh,64px)/1 var(--hf);letter-spacing:3px;font-variant-numeric:tabular-nums;color:#fff;padding:2px 22px;border:2px solid var(--line);border-radius:999px}
#ct.run{color:var(--work);border-color:var(--work)}
#cn2{text-align:right;color:var(--mut);font:600 clamp(16px,2.6vh,28px) var(--hf);letter-spacing:2px;text-transform:uppercase}
#cb{flex:1;min-height:0;display:flex;gap:20px;margin-top:16px;direction:ltr}
#cb.demo{justify-content:center}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:.5em;overflow:hidden;font-size:var(--fs,28px)}
#cb.demo .col{max-width:1000px}
.col h3{margin:0 0 .2em;padding-bottom:.3em;border-bottom:2px solid var(--work);font:700 .55em var(--hf);letter-spacing:.16em;color:var(--mut)}
.kp{border:2px solid var(--line);border-radius:.6em;padding:.45em .8em;background:#0f0f0f;transition:all .25s}
.kp.act{border-color:var(--work);background:linear-gradient(160deg,rgba(225,95,0,.3),rgba(225,95,0,.08));box-shadow:0 0 .8em rgba(225,95,0,.55)}
.kp.done{opacity:.28}
.kt{display:flex;justify-content:space-between;align-items:center;font:700 .55em var(--hf);letter-spacing:.12em;color:var(--work);text-transform:uppercase;margin-bottom:.15em}
.kb{background:var(--work);color:#000;border-radius:999px;padding:0 .8em}
.kl{font:700 1em/1.12 var(--hf);text-transform:uppercase;letter-spacing:.02em;padding:.06em 0}
.kr{color:var(--work)}
.kd{font-size:.52em;background:#fff;color:#000;border-radius:999px;padding:.05em .7em;margin-inline-start:.6em;vertical-align:middle;letter-spacing:.04em}
#cc{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(700px,94vw);z-index:6;opacity:0;pointer-events:none;transition:opacity .25s;flex-wrap:wrap}
#cc.v{opacity:1;pointer-events:auto}#cc button{background:rgba(18,18,18,.96);min-width:30%}
/* compact fitness display: slim header, big media */
#show.on{display:grid;grid-template-columns:auto 1fr auto auto;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"lg st tm inf" "br br br br" "mn mn mn mn" "tt tt tt tt";column-gap:16px;row-gap:6px;align-items:center;padding:max(8px,env(safe-area-inset-top,0px)) 14px max(8px,env(safe-area-inset-bottom,0px))}
#show.on>img.logo{grid-area:lg;height:clamp(28px,5vh,52px);width:auto;margin:0;max-width:none}
#show.on #state{grid-area:st;justify-self:center;margin:0;padding:1px 16px;font-size:clamp(14px,2.4vh,28px);max-width:100%}
#show.on #time{grid-area:tm;font-size:clamp(32px,6.5vh,72px);line-height:1}
#show.on>#top{grid-area:inf;flex-direction:row;gap:14px;justify-content:flex-end;font-size:clamp(12px,1.9vh,22px)}
#show.on #cn{display:none}
#show.on #bar{grid-area:br;margin:0;height:6px;align-self:stretch}
#show.on #cards,#show.on #big{grid-area:mn;margin:0;align-self:stretch}
#show.on #tot{grid-area:tt;margin:2px 0 0;height:12px;align-self:stretch}
.c{padding:0;position:relative;justify-content:flex-end;gap:0}
.c video,.c img,.c .art{position:absolute;inset:0;width:100%;height:100%;margin:0;border-radius:0;object-fit:contain;background:#000}
.c .art{padding-bottom:24%;box-sizing:border-box;background:radial-gradient(ellipse at 50% 70%,#2b1a0f,#0d0d0d 72%)!important}
.c::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,rgba(0,0,0,.85));pointer-events:none;z-index:1}
.c b,.c .tg{position:relative;z-index:2;padding:0 12px;text-shadow:0 2px 6px #000}
.c b{font-size:clamp(16px,min(2.9vh,2.7vw),36px)}
.c .tg{padding-bottom:10px;font-size:clamp(16px,min(3.2vh,3vw),40px)}
.big b{font-size:clamp(30px,min(6.5vh,7.5vw),84px)}.big .tg{font-size:clamp(26px,min(5.5vh,6.5vw),68px);padding-bottom:16px}
.num{top:8px;left:8px}
/* clean typography: no letter-spacing on Arabic, roomy line-height, stable bidi */
*{letter-spacing:normal!important}
#time,#ct{letter-spacing:1px!important}
button,label,h3,h4,.lh span,#state,#top span,#cn2,.saved span,.kt span,.tabs button,.chk{unicode-bidi:plaintext;line-height:1.55}
label{font-size:14px;font-weight:500}
.lv h4,.col h3{font-weight:800}
.grid{gap:12px}
.saved span{font-weight:500}
.col{max-height:100%}
.pl{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:repeat(var(--pc,1),minmax(0,1fr));gap:.5em;align-content:start}
.pl .kp{align-self:start}
:-webkit-full-screen #ch{padding-left:64px}
:fullscreen #ch{padding-left:64px}
:-webkit-full-screen #show.on>img.logo{margin-left:56px}
:fullscreen #show.on>img.logo{margin-left:56px}
</style>
</head>
<body>
<div class="wrap" id="setup">
  <div class="hero"><img class="logo" data-logo alt="180 Fitness"></div>
  <div class="tabs"><button id="tc" class="p" onclick="tab('c')">Fitness · فتنس</button><button id="tl" onclick="tab('l')">Library · المكتبة</button><button id="tk" onclick="tab('k')">Calisthenics · كاليستنكس</button></div>

  <div id="pgC">
    <div class="saved" id="saved"></div>
    <label>Fitness name · اسم الفتنس</label>
    <input id="cname" value="Day 1" style="margin-bottom:12px">
    <div class="grid">
      <div><label>Stations 4-12 · المحطات</label><input id="n" type="number" min="4" max="12" value="7"></div>
      <div><label>Rounds · الجولات</label><input id="r" type="number" min="1" value="3"></div>
      <div><label>Work sec · التمرين</label><input id="w" type="number" min="5" value="40"></div>
      <div><label>Rest sec · الراحة</label><input id="rs" type="number" min="0" value="20"></div>
      <div><label>Round rest sec · راحة الجولة</label><input id="rr" type="number" min="0" value="60"></div>
      <div><label>Get ready sec · استعداد</label><input id="gr" type="number" min="0" value="10"></div>
      <div><label>Demo per exercise sec · ديمو</label><input id="dd" type="number" min="3" value="10"></div>
      <div><label>Move to stations sec · انتقال</label><input id="dt" type="number" min="0" value="60"></div>
    </div>
    <label>Exercises · التمارين</label>
    <div id="items"></div>
    <div class="row"><button onclick="save()">Save · حفظ</button><button onclick="del()">Delete · حذف</button></div>
    <div class="row" style="margin-top:8px"><button onclick="run(true)">▶ Demo · ديمو</button><button class="p" onclick="run(false)">▶ Start · ابدأ</button></div>
  </div>

  <div id="pgL" style="display:none">
    <div class="row" style="margin-bottom:10px"><input id="newN" placeholder="New exercise · تمرين جديد" style="flex:3"><button onclick="addEx()">Add · إضافة</button></div>
    <div class="names" id="libList"></div>
    <div class="row"><button onclick="exportAll()">Export · تصدير</button><label class="up">Import · استيراد<input type="file" accept=".json" hidden onchange="importAll(this.files[0])"></label></div>
  </div>

  <div id="pgK" style="display:none">
    <div class="saved" id="ksaved"></div>
    <label>Workout name · اسم التمرين</label>
    <input id="kname" value="Day 1" style="margin-bottom:12px">
    <div class="grid">
      <div><label>Countdown min, blank = stopwatch · تنازلي</label><input id="kcd" type="number" min="0" placeholder="—"></div>
      <div><label>Demo sec per part · مدة الديمو</label><input id="kdd" type="number" min="3" value="10"></div>
      <div style="grid-column:1/3"><label class="chk"><input id="kauto" type="checkbox" checked> Long beep on every part change · بيب طويل عند كل انتقال</label></div>
    </div>
    <div id="kparts"></div>
    <button onclick="addPart()" style="width:100%;margin-bottom:12px">＋ Add workout · إضافة جزء</button>
    <div class="row"><button onclick="ksave()">Save · حفظ</button><button onclick="kdel()">Delete · حذف</button></div>
    <div class="row" style="margin-top:8px"><select id="klvl"><option value="adv">Demo: Advanced · متقدمين</option><option value="beg">Demo: Beginner · مبتدئين</option></select><button onclick="krun(true)">▶ Demo · ديمو</button></div>
    <button class="p" style="width:100%;margin-top:8px" onclick="krun(false)">▶ Start · ابدأ</button>
    <datalist id="calList"></datalist>
  </div>
</div>

<div id="show">
  <div id="top"><span id="rd"></span><span id="cn"></span><span id="rot"></span></div>
  <img class="logo" data-logo alt="180 Fitness">
  <div id="state"></div>
  <div id="time"></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="big"></div>
  <div id="cards"></div>
  <div id="tot"><div id="totf"></div></div>
  <div class="row" id="ctl">
    <button onclick="pause()" id="pb">Pause · إيقاف</button>
    <button onclick="stop()">Stop · إنهاء</button>
  </div>
</div>

<div id="cal">
  <div id="ch"><img class="logo" data-logo alt=""><div id="ct">00:00.00</div><div id="cn2"></div></div>
  <div id="cb"></div>
  <div class="row" id="cc">
    <button id="kpb" onclick="kstart()">Start · ابدأ</button>
    <button onclick="kreset()">Reset · تصفير</button>
    <button onclick="beep(900,1.2)">Long Beep · بيب</button>
    <button onclick="kprev()">◀ Prev</button>
    <button onclick="knext()">Next ▶</button>
    <button onclick="kexit()">Exit · خروج</button>
  </div>

function solve(q,an,ax){
  const z=[0,0],P={hip:z};
  P.k1=add(z,q[1],L.th);P.a1=add(P.k1,q[2],L.sh);P.k2=add(z,q[3],L.th);P.a2=add(P.k2,q[4],L.sh);
  P.sh=add(z,q[0],L.t);P.e1=add(P.sh,q[5],L.ua);P.h1=add(P.e1,q[6],L.fa);P.e2=add(P.sh,q[7],L.ua);P.h2=add(P.e2,q[8],L.fa);
  P.hd=add(P.sh,q[0],L.hr+3);
  const o=an=='h'?[ax-P.h1[0],94-P.h1[1]]:an=='b'?[ax-P.h1[0],6-P.h1[1]]:an=='p'?[ax,50-q[9]]:[ax-P.a1[0],94-P.a1[1]-q[9]];
  for(const k in P)P[k]=[P[k][0]+o[0],P[k][1]+o[1]];
  return P;
}

function upd(F,t,force){
  if(!force&&F.w.offsetParent===null)return;
  const d=F.d,k=.5-.5*Math.cos(2*Math.PI*((t/1000/d.p)%1)),a=d.f[0],b=d.f[1];
  const q=a.map((v,i)=>v+(b[i]-v)*k),P=solve(q,d.an,d.ax),g=p=>p[0].toFixed(1)+' '+p[1].toFixed(1);
  const sd=(c,s)=>F[c].forEach(e=>e.setAttribute('d',s));
  sd('fl','M'+g(P.hip)+'L'+g(P.k2)+'L'+g(P.a2)+'l5 0');
  sd('nl','M'+g(P.hip)+'L'+g(P.k1)+'L'+g(P.a1)+'l5 0');
  sd('to','M'+g(P.hip)+'L'+g(P.sh));
  sd('fa','M'+g(P.sh)+'L'+g(P.e2)+'L'+g(P.h2));
  sd('na','M'+g(P.sh)+'L'+g(P.e1)+'L'+g(P.h1));
  F.hd.setAttribute('cx',P.hd[0].toFixed(1));F.hd.setAttribute('cy',P.hd[1].toFixed(1));
  const tr=(e,p)=>e&&e.setAttribute('transform','translate('+g(p)+')');
  if(d.eq=='db'){tr(F.d1,P.h1);tr(F.d2,P.h2)}
  else if(d.eq=='kb'||d.eq=='ball')tr(F.d1,[(P.h1[0]+P.h2[0])/2,(P.h1[1]+P.h2[1])/2]);
  else if(d.eq=='rope'){const rp=(e,h)=>e.setAttribute('d','M'+g(h)+'Q'+((h[0]+112)/2).toFixed(1)+' '+(h[1]+(h[1]-80)*.6).toFixed(1)+' 112 80');rp(F.r1,P.h1);rp(F.r2,P.h2)}
}

let cal=ST('g180cal',null);
if(!cal){cal={'Day 1':{name:'Day 1',cd:0,dd:10,auto:true,parts:[
 P('Workout 1','×2',['3|Muscle-ups','10|Pull-ups','3|Muscle-ups','10|Wide Pull-ups'],['6|Pull-ups','10|Assisted Pull-ups','5|Wide Pull-ups','10|Wide Assisted Pull-ups']),
 P('Workout 2','EMOM 8 min',['10|Dips','5|SBD'],['7|Dips','7|Incline Push-ups']),
 P('Workout 3','EMOM 8 min',['10|Pull-ups','10|Chin-ups'],['5|Band Pull-ups','8|Assisted Pull-ups','5|Band Chin-ups','8|Assisted Chin-ups']),
 P('Workout 4','×4',['25|Push-ups'],['15|Push-ups'])]}};SV('g180cal',cal)}
function kdl(){const s=new Set(CALX);Object.values(cal).forEach(c=>c.parts.forEach(p=>['adv','beg'].forEach(l=>p[l].forEach(x=>x.n&&s.add(x.n)))));$('calList').innerHTML=[...s].map(n=>'<option value="'+esc(n)+'">').join('')}
function lineRow(c,o){const d=document.createElement('div');d.className='ln';d.innerHTML='<input class="rp" placeholder="10"><input class="ex" list="calList" placeholder="Exercise"><input class="ld" placeholder="Load (optional)"><button type="button" class="x">×</button>';const q=s=>d.querySelector(s);q('.rp').value=o.r||'';q('.ex').value=o.n||'';q('.ld').value=o.l||'';q('.x').onclick=()=>d.remove();c.appendChild(d)}
function partRow(o){
  const d=document.createElement('div');d.className='part';
  d.innerHTML='<div class="ph"><input class="pt" placeholder="Workout 1"><input class="pb" placeholder="EMOM 8 min / ×2"><button type="button" class="x pdel">×</button></div><div class="lv"><h4>ADVANCED · المتقدمين</h4><div class="lh"><span>Reps · عدد</span><span>Exercise · التمرين</span><span>Load · الوزن (اختياري)</span><span></span></div><div class="ls adv"></div><button type="button" class="add" data-l="adv">＋ Line · سطر</button></div><div class="lv"><h4>BEGINNER · المبتدئين</h4><div class="lh"><span>Reps · عدد</span><span>Exercise · التمرين</span><span>Load · الوزن (اختياري)</span><span></span></div><div class="ls beg"></div><button type="button" class="add" data-l="beg">＋ Line · سطر</button></div>';
  const q=s=>d.querySelector(s);q('.pt').value=o.t||'';q('.pb').value=o.b||'';
  ['adv','beg'].forEach(l=>{const c=q('.ls.'+l);(o[l]||[]).forEach(x=>lineRow(c,x));q('[data-l='+l+']').onclick=()=>{if(c.children.length<6)lineRow(c,{})}});
  q('.pdel').onclick=()=>d.remove();$('kparts').appendChild(d);
}
function addPart(){if(document.querySelectorAll('#kparts .part').length<8)partRow({adv:[{}],beg:[{}]})}
function kcfg(){
  const g=(d,l)=>[...d.querySelectorAll('.ls.'+l+' .ln')].map(r=>({r:r.querySelector('.rp').value.trim(),n:r.querySelector('.ex').value.trim(),l:r.querySelector('.ld').value.trim()})).filter(x=>x.n||x.r);
  return{name:$('kname').value.trim()||'Workout',cd:+$('kcd').value||0,dd:+$('kdd').value||10,auto:$('kauto').checked,parts:[...document.querySelectorAll('#kparts .part')].map((d,i)=>({t:d.querySelector('.pt').value.trim()||'Workout '+(i+1),b:d.querySelector('.pb').value.trim(),adv:g(d,'adv'),beg:g(d,'beg')}))};
}
function kload(c){$('kname').value=c.name;$('kcd').value=c.cd||'';$('kdd').value=c.dd||10;$('kauto').checked=c.auto!==false;$('kparts').innerHTML='';c.parts.forEach(partRow)}
function kdrawSaved(){const b=$('ksaved');b.innerHTML='';Object.keys(cal).forEach(k=>{const s=document.createElement('span');s.textContent=k;s.onclick=()=>kload(cal[k]);b.appendChild(s)})}
function ksave(){const c=kcfg();cal[c.name]=c;SV('g180cal',cal);kdrawSaved();kdl()}
function kdel(){const k=$('kname').value.trim();if(cal[k]&&confirm('Delete '+k+'?')){delete cal[k];SV('g180cal',cal);kdrawSaved()}}
kdl();kdrawSaved();kload(cal[Object.keys(cal)[0]]);

/* Calisthenics display */
let K=null,kl='adv',ki=0,kel=0,kt0=0,kon=false,kraf=0,kmode='run',kdi=0,kdlist=[],kleft=0,kint=null,kto=null;
function kcard(p,l,i){
  const d=document.createElement('div');d.className='kp';d.dataset.i=i;
  const t=document.createElement('div');t.className='kt';const a=document.createElement('span');a.textContent=p.t;t.appendChild(a);
  if(p.b){const b=document.createElement('span');b.className='kb';b.textContent=p.b;t.appendChild(b)}
  d.appendChild(t);
  p[l].forEach(x=>{const r=document.createElement('div');r.className='kl';
    const rp=document.createElement('span');rp.className='kr';rp.textContent=x.r?x.r+' ':'';r.appendChild(rp);
    r.appendChild(document.createTextNode(x.n));
    if(x.l){const e=document.createElement('span');e.className='kd';e.textContent=x.l;r.appendChild(e)}
    d.appendChild(r)});
  return d;
}
function kcol(l,h,idx){const c=document.createElement('div');c.className='col';const t=document.createElement('h3');t.textContent=h;c.appendChild(t);const pl=document.createElement('div');pl.className='pl';idx.forEach(i=>pl.appendChild(kcard(K.parts[i],l,i)));c.appendChild(pl);return c}
function kmark(){document.querySelectorAll('#cb .kp').forEach(d=>{const i=+d.dataset.i;d.classList.toggle('act',i==ki);d.classList.toggle('done',i<ki&&kmode=='run')})}
function kfit(big,again){
  const cols=[...document.querySelectorAll('#cb .col')];if(!cols.length)return;
  const pls=cols.map(c=>c.querySelector('.pl'));
  const hi=Math.floor(innerHeight*(big?.14:.09));
  const fits=()=>pls.every(p=>p.scrollHeight<=p.clientHeight+1&&p.scrollWidth<=p.clientWidth+1);
  const best=pc=>{cols.forEach(c=>c.style.setProperty('--pc',pc));let lo=9,h=hi,r=9;while(lo<=h){const m=(lo+h)>>1;cols.forEach(c=>c.style.setProperty('--fs',m+'px'));if(fits()){r=m;lo=m+1}else h=m-1}return r};
  const a=best(1),b=big?0:best(2),pc=b>a*1.08?2:1,fs=pc==2?b:a;
  cols.forEach(c=>{c.style.setProperty('--pc',pc);c.style.setProperty('--fs',fs+'px')});
  if(!again){
    const re=()=>{if($('cal').classList.contains('on'))kfit(big,1)};
    setTimeout(re,700);
    if(document.fonts&&document.fonts.status==='loading')document.fonts.ready.then(re);
  }
}
function krender(){
  const cb=$('cb');cb.className='';cb.innerHTML='';
  [['adv','ADVANCED · المتقدمين'],['beg','BEGINNER · المبتدئين']].forEach(([l,h])=>{if(K.parts.some(p=>p[l].length))cb.appendChild(kcol(l,h,K.parts.map((p,i)=>i)))});
  kmark();kfit();
}
function kdemo(){
  const cb=$('cb');cb.className='demo';cb.innerHTML='';
  cb.appendChild(kcol(kl,kl=='adv'?'DEMO · ADVANCED · المتقدمين':'DEMO · BEGINNER · المبتدئين',[ki]));
  $('ct').textContent='DEMO '+(kdi+1)+'/'+kdlist.length;kmark();kfit(true);
}
const kp2=n=>String(n).padStart(2,'0');
function kdraw(){
  const ms=K.cd?Math.max(0,K.cd*60000-kel):kel;
  if(K.cd&&ms===0&&kon){kon=false;cancelAnimationFrame(kraf);$('kpb').textContent='Start · ابدأ';$('ct').classList.remove('run');beep(900,1.4)}
  $('ct').textContent=kp2(Math.floor(ms/60000))+':'+kp2(Math.floor(ms/1000)%60)+'.'+kp2(Math.floor(ms%1000/10));
}
function ktick(now){if(!kon)return;kel=now-kt0;kdraw();if(kon)kraf=requestAnimationFrame(ktick)}
function kstart(){
  if(kmode!='run')return;
  if(kon){kon=false;cancelAnimationFrame(kraf);$('kpb').textContent='Start · ابدأ'}
  else{kt0=performance.now()-kel;kon=true;beep(880,.3);kraf=requestAnimationFrame(ktick);$('kpb').textContent='Pause · إيقاف'}
  $('ct').classList.toggle('run',kon);
}
function kreset(){if(kmode!='run')return;kon=false;cancelAnimationFrame(kraf);kel=0;$('kpb').textContent='Start · ابدأ';$('ct').classList.remove('run');kdraw()}
function knext(){
  if(kmode=='demo'){kdemoNext();return}
  if(ki<K.parts.length-1){ki++;kmark();if(K.auto)beep(900,1.2)}
}
function kprev(){if(kmode=='run'&&ki>0){ki--;kmark()}}
function kmode_run(){kmode='run';ki=0;kel=0;kon=false;$('kpb').textContent='Start · ابدأ';$('ct').classList.remove('run');krender();kdraw()}
function kdemoStart(){
  kdlist=K.parts.map((p,i)=>i).filter(i=>K.parts[i][kl].length);
  if(!kdlist.length){kmode_run();return}
  kdi=0;ki=kdlist[0];kleft=K.dd;kmode='demo';kdemo();beep(880,.3);
  clearInterval(kint);kint=setInterval(()=>{kleft--;if(kleft<=0)kdemoNext()},1000);
}
function kdemoNext(){
  kdi++;
  if(kdi>=kdlist.length){clearInterval(kint);kmode_run();$('cc').classList.add('v');clearTimeout(kto);kto=setTimeout(()=>$('cc').classList.remove('v'),6000);return}
  ki=kdlist[kdi];kleft=K.dd;kdemo();beep(880,.3);
}
function krun(demo){
  K=kcfg();if(!K.parts.length)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume()}catch(e){}
  $('setup').style.display='none';$('cal').classList.add('on');$('cn2').textContent=K.name;
  try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}
  keepAwake();kl=$('klvl').value;
  if(demo)kdemoStart();else kmode_run();
}
function kexit(){clearInterval(kint);kon=false;cancelAnimationFrame(kraf);try{wl&&wl.release()}catch(e){}$('cal').classList.remove('on');$('setup').style.display='';try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}}
$('cal').onclick=()=>{$('cc').classList.add('v');clearTimeout(kto);kto=setTimeout(()=>$('cc').classList.remove('v'),4000)};
addEventListener('resize',()=>{if($('cal').classList.contains('on'))kfit(kmode=='demo')});

/* Backup */
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
function unb64(u){const[h,d]=u.split(',');const s=atob(d),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new Blob([a],{type:h.match(/:(.*?);/)[1]})}
async function exportAll(){
  const bl={};for(const e of lib)if(e.k){try{const b=await dbGet(e.k);if(b)bl[e.k]=await b64(b)}catch(x){}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({lib,cls,bl,cal})],{type:'application/json'}));a.download='180-backup.json';a.click();
}
async function importAll(f){
  if(!f)return;
  try{const d=JSON.parse(await f.text());for(const k in d.bl)await dbPut(k,unb64(d.bl[k]));lib=d.lib;cls=d.cls;cal=d.cal||cal;SV('g180cal',cal);kdrawSaved();kdl();saveLib();SV('g180cls',cls);drawLib();drawSaved();loadCls(cls[Object.keys(cls)[0]]);alert('Done · تم')}
  catch(e){alert('Invalid file · ملف غير صالح')}
}

/* Display */
const TXT={demo:'DEMO · ديمو',move:'GO TO YOUR STATIONS · توجهوا لمحطاتكم',ready:'GET READY · استعدوا',work:'WORK · تمرين',rest:'REST · راحة',round:'ROUND REST · راحة الجولة'};
let tot=1,ct=null,ph=[],i=0,left=0,t=null,paused=false,ac=null,wl=null,bigEls=[],R=1,N=1;
function beep(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.value=.25;o.start();o.stop(ac.currentTime+d)}catch(e){}}
async function keepAwake(){try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&$('show').classList.contains('on'))keepAwake()});
const tgt=it=>it.m&&it.v?it.v+' '+({reps:'reps',cal:'calories',sec:'sec'}[it.m]):'';
async function media(e){
  if(e.k){try{const bl=await dbGet(e.k);if(bl){let el;
    if(e.t=='v'){el=document.createElement('video');el.muted=el.loop=el.autoplay=el.playsInline=true;el.setAttribute('playsinline','');el.setAttribute('muted','')}else el=document.createElement('img');
    el.src=URL.createObjectURL(bl);return el}}catch(x){}}
  return fig(e.a);
}
async function card(e,it,j,big){
  const d=document.createElement('div');d.className='c'+(big?' big':'');
  d.appendChild(await media(e));
  const s=document.createElement('div');s.className='num';s.textContent=j+1;
  const b=document.createElement('b');b.textContent=e.n;
  const g=document.createElement('div');g.className='tg';g.textContent=tgt(it);
  d.append(s,b,g);return d;
}
function build(c,demo){
  ph=[];
  if(demo){c.items.forEach((it,j)=>ph.push({t:'demo',i:j,d:c.dd}));if(c.dt>0)ph.push({t:'move',d:c.dt})}
  if(c.gr>0)ph.push({t:'ready',d:c.gr});
  for(let r=1;r<=c.r;r++)for(let k=1;k<=c.items.length;k++){
    ph.push({t:'work',r,k,d:c.w});
    const last=k==c.items.length;
    if(last&&r==c.r)continue;
    const d=last?c.rr:c.rs;
    if(d>0)ph.push({t:'rest',r,k,d,round:last});
  }
}
async function run(demo){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume()}catch(e){}
  const c=cfg();c.items=c.items.filter(it=>lib.find(e=>e.id==it.id));
  if(!c.items.length)return;
  R=c.r;N=c.items.length;build(c,demo);tot=ph.reduce((s,p)=>s+p.d,0);$('totf').style.transition='none';$('totf').style.width='100%';setTimeout(()=>$('totf').style.transition='',50);
  figs.clear();$('cn').textContent=c.name;$('cards').innerHTML='';bigEls=[];$('cards').style.setProperty('--cols',N<=4?2:N<=6?3:N<=8?4:N==9?3:N==10?5:4);
  for(let j=0;j<N;j++){
    const it=c.items[j],e=lib.find(q=>q.id==it.id);
    $('cards').appendChild(await card(e,it,j,false));
    if(demo)bigEls.push(await card(e,it,j,true));
  }
  $('setup').style.display='none';$('show').classList.add('on');
  try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}
  keepAwake();i=0;paused=false;$('pb').textContent='Pause · إيقاف';go();clearInterval(t);t=setInterval(tick,1000);
}
function cue(p){
  if(p.t=='work')beep(1200,.7);
  else if(p.t=='rest'){beep(520,.22);setTimeout(()=>beep(520,.22),330)}
  else beep(880,.3);
}
function go(){
  const p=ph[i];left=p.d;
  const rr=p.t=='rest'&&p.round;
  $('show').className='on '+(rr||p.t=='move'?'rest':p.t=='demo'?'work':p.t);
  $('state').textContent=rr?TXT.round:TXT[p.t];
  const big=p.t=='demo';
  $('big').style.display=big?'flex':'none';$('cards').style.display=big?'none':'grid';
  if(big){$('big').innerHTML='';$('big').appendChild(bigEls[p.i])}
  else document.querySelectorAll('#cards video').forEach(v=>v.play().catch(()=>{}));
  $('rd').textContent=p.r?'Round '+p.r+'/'+R:(big?'Demo '+(p.i+1)+'/'+N:'');
  $('rot').textContent=p.k?'Rotation '+p.k+'/'+N:'';
  draw();cue(p);
}
function draw(){const p=ph[i];$('time').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('fill').style.width=(100*(p.d-left)/p.d)+'%';let el=p.d-left;for(let q=0;q<i;q++)el+=ph[q].d;$('totf').style.width=(100*(1-el/tot))+'%'}
function tick(){
  if(paused)return;
  left--;
  if(ph[i].t!='demo'&&left<=3&&left>0)beep(660,.1);
  if(left<=0){i++;if(i>=ph.length){beep(1000,.8);$('show').className='on done';$('state').textContent='DONE · انتهى 💪';$('time').textContent='0:00';$('totf').style.width='0%';clearInterval(t);return}go();return}
  draw();
}
$('show').onclick=()=>{$('ctl').classList.add('v');clearTimeout(ct);ct=setTimeout(()=>$('ctl').classList.remove('v'),4000)};
function pause(){paused=!paused;$('pb').textContent=paused?'Resume · استئناف':'Pause · إيقاف'}
function skip(){if(i<ph.length-1){i++;go()}}
function stop(){try{wl&&wl.release()}catch(e){}clearInterval(t);$('show').className='';$('setup').style.display='';try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}}
</script>
</body>
